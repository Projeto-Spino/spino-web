name: Auto Deploy via SSH

on:
  push:
    branches:
      - main # Dispara o deploy quando houver push na branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos via SSH no Servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            bash -lc '
              set -Eeuo pipefail

              APP_DIR="${{ secrets.SSH_APP_PATH }}"

              if [ -z "$APP_DIR" ]; then
                search_roots=("$HOME" /var/www /srv /opt /home /www /data /apps /usr/share/nginx)

                for search_root in "${search_roots[@]}"; do
                  [ -d "$search_root" ] || continue

                  while IFS= read -r artisan_path; do
                    candidate_dir="${artisan_path%/artisan}"

                    if [ -f "$candidate_dir/.git/config" ] && grep -q "Projeto-Spino/spino-web" "$candidate_dir/.git/config"; then
                      APP_DIR="$candidate_dir"
                      break
                    fi

                    if [ -f "$candidate_dir/config/competition.php" ] && [ -f "$candidate_dir/resources/js/Pages/Public/Dashboard.jsx" ]; then
                      APP_DIR="$candidate_dir"
                      break
                    fi
                  done < <(find "$search_root" -maxdepth 10 -type f -name artisan -print 2>/dev/null)

                  if [ -n "$APP_DIR" ]; then
                    break
                  fi
                done
              fi

              if [ -z "$APP_DIR" ] && command -v timeout >/dev/null 2>&1; then
                while IFS= read -r artisan_path; do
                  candidate_dir="${artisan_path%/artisan}"

                  if [ -f "$candidate_dir/.git/config" ] && grep -q "Projeto-Spino/spino-web" "$candidate_dir/.git/config"; then
                    APP_DIR="$candidate_dir"
                    break
                  fi

                  if [ -f "$candidate_dir/config/competition.php" ] && [ -f "$candidate_dir/resources/js/Pages/Public/Dashboard.jsx" ]; then
                    APP_DIR="$candidate_dir"
                    break
                  fi
                done < <(timeout 30s find / -type f -name artisan -print 2>/dev/null || true)
              fi

              if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/artisan" ]; then
                echo "ERRO: não foi possível localizar o diretório do spino-web." >&2
                echo "Configure o secret SSH_APP_PATH com o caminho absoluto do projeto no servidor." >&2
                echo "Usuário SSH: $(id -un)" >&2
                echo "HOME: $HOME" >&2
                echo "Diretório inicial: $PWD" >&2
                echo "O usuário SSH não consegue enxergar o projeto nas pastas comuns do servidor." >&2
                exit 1
              fi

              cd "$APP_DIR"
              echo "Diretório do deploy: $PWD"

              if ! command -v git >/dev/null 2>&1; then
                echo "ERRO: git não está disponível no PATH da sessão SSH." >&2
                exit 127
              fi

              if ! command -v docker >/dev/null 2>&1; then
                echo "ERRO: Docker não está disponível no host SSH." >&2
                exit 127
              fi

              if ! docker info >/dev/null 2>&1; then
                echo "ERRO: o usuário SSH não possui permissão para acessar o Docker." >&2
                exit 1
              fi

              if ! docker compose version >/dev/null 2>&1; then
                echo "ERRO: o plugin docker compose não está disponível no servidor." >&2
                exit 127
              fi

              container_mode="compose"
              container_id="$(docker compose ps -q app)"

              if [ -z "$container_id" ]; then
                container_mode="direct"

                for candidate_id in $(docker ps -q); do
                  if docker exec "$candidate_id" test -f /app/artisan \
                    && docker exec "$candidate_id" test -f /app/config/competition.php \
                    && docker exec "$candidate_id" test -f /app/resources/js/Pages/Public/Dashboard.jsx; then
                    container_id="$candidate_id"
                    break
                  fi
                done
              fi

              if [ -z "$container_id" ] || [ "$(docker inspect -f "{{.State.Running}}" "$container_id")" != "true" ]; then
                echo "ERRO: o container do serviço app não está em execução." >&2
                echo "Execute docker compose up -d --build no diretório $APP_DIR." >&2
                exit 1
              fi

              run_app() {
                if [ "$container_mode" = "compose" ]; then
                  docker compose exec -T --user laravel app "$@"
                else
                  docker exec --user laravel "$container_id" "$@"
                fi
              }

              for tool in php composer npm; do
                if ! run_app "$tool" --version >/dev/null 2>&1; then
                  echo "ERRO: $tool não está disponível dentro do container app." >&2
                  exit 127
                fi
              done

              echo "Runtime validado no container: $container_id ($container_mode)"

              if [ ! -f database/database.sqlite ]; then
                echo "ERRO: database/database.sqlite não existe em $PWD." >&2
                exit 1
              fi

              backup_path="database/database-$(date +%Y-%m-%d_%Hh%Mm%Ss).sqlite"
              cp -- database/database.sqlite "$backup_path"
              echo "Backup criado em: $backup_path"

              git pull --ff-only origin main

              maintenance=0
              restore_application() {
                if [ "$maintenance" -eq 1 ]; then
                  run_app php artisan up || true
                fi
              }
              trap restore_application EXIT

              run_app php artisan down
              maintenance=1

              run_app composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
              run_app php artisan migrate --force
              run_app npm ci --no-audit --no-fund
              run_app npm run build
              run_app php artisan optimize
              run_app php artisan reload

              run_app php artisan up
              maintenance=0
              trap - EXIT
            '
